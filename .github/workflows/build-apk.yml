name: 构建 Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: 打包 APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 整理产物
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/schulte.apk

      - name: 发布到 Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest >/dev/null 2>&1 \
            || gh release create latest \
                 --title "舒尔特方格（最新版）" \
                 --notes "由 GitHub Actions 自动构建，每次推送自动更新。"
          gh release upload latest out/schulte.apk --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: schulte-apk
          path: out/schulte.apk
